# VMess + TLS (tanpa WebSocket) - Go parity
# Server harus support VMess + TLS di port 443

[[vmess]]
addr = "1.2.3.4:443"
uuid = "b831381d-6324-4d53-ad4f-8cda48b30811"
method = "aes-128-gcm"
tag = "vmess"

[[tls]]
sni = "example.com"
tag = "tls"

[[direct]]
tag = "direct"

[[blackhole]]
tag = "block"

[[outbounds]]
chain = ["tls", "vmess"]
tag = "proxy"

[[outbounds]]
chain = ["direct"]
tag = "direct-out"

[[outbounds]]
chain = ["block"]
tag = "block-out"

[[inbounds]]
addr = "127.0.0.1:1080"
enable_udp = true
tag = "socks"

[[inbounds]]
addr = "127.0.0.1:1081"
tag = "http"

# Routing opsional
[[geoip_rules]]
tag = "direct-out"
rules = ["private"]

[[geosite_rules]]
tag = "direct-out"
rules = ["cn"]
