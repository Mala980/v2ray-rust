# Free Config - ASIA+VMESS-WS TLS (2026-10-05)
# vmess:
# Decoded: add=asia1.fufo.org port=443 net=ws path=/vmws tls=tls sni=ruangguru.com scy=none
# Test: curl -x socks5h://127.0.0.1:1080 https://ifconfig.me

[[vmess]]
addr = "asia1.fufo.org:443"
uuid = "4473fd00-baaf-11f1-b037-205c6d5f5d78"
method = "none"
tag = "vmess"

[[ws]]
uri = "wss://ruangguru.com:443/vmws?ed=2048"
# SNI ruangguru.com digunakan untuk TLS, host header otomatis
tag = "ws"

[[tls]]
sni = "ruangguru.com"
tag = "tls"

[[direct]]
tag = "direct"

[[blackhole]]
tag = "block"

[[outbounds]]
chain = ["tls", "ws", "vmess"]
tag = "proxy"

[[outbounds]]
chain = ["direct"]
tag = "direct-out"

[[outbounds]]
chain = ["block"]
tag = "block-out"

[[inbounds]]
addr = "127.0.0.1:1080"
enable_udp = true
tag = "socks"

[[inbounds]]
addr = "127.0.0.1:1081"
tag = "http"

# Routing
[[geoip_rules]]
tag = "direct-out"
rules = ["private"]

[[geosite_rules]]
tag = "direct-out"
rules = ["cn"]

[[geosite_rules]]
tag = "block-out"
rules = ["category-ads-all"]
