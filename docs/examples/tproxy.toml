# TPROXY Transparent Proxy - Linux only, Go parity
# Memerlukan CAP_NET_ADMIN dan iptables

[[direct]]
tag = "direct"

[[outbounds]]
chain = ["direct"]
tag = "proxy"

# Dokodemo-door dengan tproxy = true
# Akan intercept traffic via iptables TPROXY
[[dokodemo]]
addr = "127.0.0.1:12345"
tproxy = true

# Inbound TPROXY
[[inbounds]]
addr = "127.0.0.1:1080"
enable_udp = true
tag = "socks"

# Setup iptables (jalankan sebagai root):
# iptables -t mangle -N V2RAY
# iptables -t mangle -A V2RAY -d 127.0.0.0/8 -j RETURN
# iptables -t mangle -A V2RAY -d 224.0.0.0/4 -j RETURN
# iptables -t mangle -A V2RAY -d 255.255.255.255/32 -j RETURN
# iptables -t mangle -A V2RAY -d 192.168.0.0/16 -j RETURN
# iptables -t mangle -A V2RAY -p tcp -j TPROXY --on-port 12345 --tproxy-mark 1
# iptables -t mangle -A V2RAY -p udp -j TPROXY --on-port 12345 --tproxy-mark 1
# iptables -t mangle -A PREROUTING -j V2RAY
# ip rule add fwmark 1 table 100
# ip route add local 0.0.0.0/0 dev lo table 100
# echo 1 > /proc/sys/net/ipv4/ip_forward
