name: Rustls-Android-Static

permissions:
  contents: write

on:
  push:
    branches:
      - 'arena/*'
    paths:
      - 'src/proxy/tls/**'
      - 'Cargo.toml'
      - '.github/workflows/rustls-android.yml'
  workflow_dispatch:

jobs:
  build-rustls-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1.6.0
        with:
          ndk-version: r26d
          add-to-path: true
      - name: Android - Set linkers
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev cmake perl golang nasm pkg-config
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=aarch64-linux-android21-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=llvm-ar" >> $GITHUB_ENV
      - name: Install Rust
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add aarch64-linux-android
      - name: Install Protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || true
      - name: Build Android with rustls-tls (pure Rust, no C++)
        shell: bash
        run: |
          set -x
          cargo ndk -t arm64-v8a -P 21 build --release --no-default-features --features rustls-tls --verbose 2>&1 | tee /tmp/build.log; EXIT=${PIPESTATUS[0]}
          echo "Build exit $EXIT"
          ls -lh target/aarch64-linux-android/release/ | head -20
          BIN=target/aarch64-linux-android/release/v2ray-rust
          if [ -f "$BIN" ]; then
            echo "Binary found"
            file "$BIN" || true
            readelf -d "$BIN" 2>&1 | head -30
            echo "=== NEEDED ==="
            readelf -d "$BIN" 2>&1 | grep NEEDED || echo "No NEEDED? static?"
            if readelf -d "$BIN" 2>&1 | grep -q "libc++_shared"; then
              echo "::error::Binary still needs libc++_shared.so - rustls fix failed"
            else
              echo "SUCCESS: Binary does NOT need libc++_shared.so - truly static!"
            fi
          else
            echo "Binary not found, showing log tail"
            tail -200 /tmp/build.log || true
          fi
          # Always show log tail for debug
          echo "=== BUILD LOG TAIL ==="
          tail -300 /tmp/build.log || true
          # Copy log for artifact and repo commit
          cp /tmp/build.log ./build.log || true
          mkdir -p logs
          cp /tmp/build.log logs/rustls-android-build.log || true
          exit $EXIT

      - name: Show build errors as annotations
        if: failure()
        shell: bash
        run: |
          echo "=== GREP ERRORS ==="
          cat /tmp/build.log | grep -i -E "error\[E|error:|failed|Caused by|undefined reference|linker" | head -100 | while IFS= read -r line; do esc=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-2000); [ -n "$esc" ] && echo "::error::$esc" || true; done
          echo "=== TAIL 50 ==="
          cat /tmp/build.log | tail -100 | while IFS= read -r line; do esc=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g' | cut -c1-2000); [ -n "$esc" ] && echo "::warning::$esc" || true; done

      - name: Upload build log artifact
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: rustls-android-build-log-${{ github.sha }}
          path: |
            /tmp/build.log
            ./build.log
            logs/rustls-android-build.log
          retention-days: 2

      - name: Commit build log to repo
        if: failure()
        shell: bash
        run: |
          set -x
          mkdir -p logs
          cp /tmp/build.log logs/rustls-android-build.log 2>&1 || cp ./build.log logs/rustls-android-build.log 2>&1 || echo "no log" > logs/rustls-android-build.log
          echo "Log size $(wc -c < logs/rustls-android-build.log)"
          tail -200 logs/rustls-android-build.log || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/rustls-android-build.log
          git commit -m "ci: add rustls android build log [skip ci]" || echo "no commit needed"
          git push origin HEAD:arena/01a0dc70-v2ray-rust --force || true
      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: android-rustls-static
          path: target/aarch64-linux-android/release/v2ray-rust
